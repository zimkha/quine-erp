# Local environment: Postgres + the app, with no profile and real authentication
# (register, log in, bearer token). Local and team use only, never production:
# it turns on the tenant self-activation route (see below).
#
# No credential is written here: export the variables first (or put them in a
# git-ignored .env file), e.g.
#   export QUINE_DB_PASSWORD=$(openssl rand -hex 16)
#   export QUINE_JWT_SECRET=$(openssl rand -base64 32)
# Compose stops with the name of any variable that is missing.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quine
      POSTGRES_PASSWORD: ${QUINE_DB_PASSWORD:?QUINE_DB_PASSWORD must be set}
      POSTGRES_DB: quine
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - quine-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quine -d quine"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: bootstrap/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUINE_DB_URL: jdbc:postgresql://postgres:5432/quine
      QUINE_DB_USER: quine
      QUINE_DB_PASSWORD: ${QUINE_DB_PASSWORD:?QUINE_DB_PASSWORD must be set}
      QUINE_JWT_SECRET: ${QUINE_JWT_SECRET:?QUINE_JWT_SECRET must be set (standard Base64, at least 32 bytes)}
      # Transitional route POST /api/organizations/{id}/activation (T7 PO-1): any
      # registered owner can activate their own organization, skipping the
      # platform's validation. True here only, for local and team use. It stays
      # false (route absent) everywhere else; T9d removes the route.
      QUINE_ORGANIZATION_TENANT_ACTIVATION_ENABLED: "true"
    ports:
      - "127.0.0.1:18080:18080"

volumes:
  quine-pgdata:
