spring:
  datasource:
    url: ${QUINE_DB_URL:jdbc:postgresql://localhost:15432/quine}
    username: ${QUINE_DB_USER:quine}
    # No default: export QUINE_DB_PASSWORD (see CLAUDE.md).
    password: ${QUINE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: ${QUINE_PORT:18080}

quine:
  security:
    # Key and lifetime of the TENANT access token (T7b-1). A platform chain
    # would be a sibling of "tenant" with its own key.
    tenant:
      jwt:
        # Standard Base64, at least 32 decoded bytes. No default: the
        # application refuses to start without it, whatever its value.
        secret: ${QUINE_JWT_SECRET}
        # Whole minutes, from 1 to 120 (default 30). No refresh token: the
        # user logs in again when it expires, plus 60 s of decoder clock skew.
        ttl-minutes: 30
